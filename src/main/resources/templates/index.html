<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Clinic Appointment Booking System</title>

<style>
body {
	font-family: Arial, sans-serif;
	margin: 30px;
	background-color: AliceBlue;
}

nav {
	margin-bottom: 25px;
}

nav a {
	margin-right: 15px;
	text-decoration: none;
	font-weight: bold;
	color: RoyalBlue;
}

nav a:hover {
	color: Navy;
}

.success-message {
	background-color: LightGreen;
	color: DarkGreen;
	padding: 15px;
	margin-bottom: 20px;
	border-radius: 6px;
	font-weight: bold;
	border: 1px solid Green;
}

.dashboard {
	display: flex;
	gap: 20px;
	margin-bottom: 30px;
}

.card {
	background-color: White;
	border: 1px solid LightGray;
	border-radius: 8px;
	padding: 20px;
	width: 180px;
	text-align: center;
	box-shadow: 0 2px 6px LightGray;
}

.card h2 {
	margin: 0;
	font-size: 32px;
	color: DarkBlue;
}

.card p {
	margin-top: 10px;
	font-weight: bold;
}

.add-button {
	display: inline-block;
	margin-bottom: 20px;
	padding: 10px 16px;
	background-color: DodgerBlue;
	color: White;
	text-decoration: none;
	border-radius: 5px;
}

.add-button:hover {
	background-color: RoyalBlue;
}

.search-form {
	margin-bottom: 20px;
	background-color: White;
	padding: 15px;
	border: 1px solid LightGray;
	border-radius: 6px;
}

.search-form input, .search-form select {
	padding: 8px;
	margin-left: 8px;
	margin-right: 8px;
	border: 1px solid Gray;
	border-radius: 4px;
}

.search-form button {
	padding: 8px 14px;
	cursor: pointer;
	background-color: DodgerBlue;
	color: White;
	border: none;
	border-radius: 4px;
}

.search-form button:hover {
	background-color: RoyalBlue;
}

.clear-link {
	margin-left: 10px;
	color: DimGray;
	font-weight: bold;
}

table {
	border-collapse: collapse;
	width: 100%;
	background-color: White;
}

table, th, td {
	border: 1px solid LightGray;
	padding: 10px;
}

th {
	background-color: LightSteelBlue;
}

.action-link {
	color: RoyalBlue;
	font-weight: bold;
	text-decoration: none;
}

.delete-link {
	color: Crimson;
	font-weight: bold;
	text-decoration: none;
}

.action-link:hover, .delete-link:hover {
	text-decoration: underline;
}

.empty-message {
	text-align: center;
	font-weight: bold;
	color: DimGray;
}
</style>

</head>

<body>

	<h1>Clinic Appointment Booking System</h1>

	<nav>

		<a href="/"> Appointments </a> <a href="/doctors"> Doctors </a> <a
			href="/patients"> Patients </a>

	</nav>

	<div class="success-message" th:if="${successMessage}">

		<span th:text="${successMessage}"> Success </span>

	</div>

	<div class="dashboard">

		<div class="card">

			<h2 th:text="${doctorCount}">0</h2>

			<p>Doctors</p>

		</div>

		<div class="card">

			<h2 th:text="${patientCount}">0</h2>

			<p>Patients</p>

		</div>

		<div class="card">

			<h2 th:text="${appointmentCount}">0</h2>

			<p>Appointments</p>

		</div>

	</div>

	<a class="add-button" href="/addAppointment"> Book New Appointment

	</a>

	<form class="search-form" method="get" action="/">

		<label for="search"> Search by Patient First Name: </label> <input
			type="text" id="search" name="search" th:value="${search}"
			placeholder="Enter patient name">

		<button type="submit">Search</button>

		<a class="clear-link" href="/"> Clear </a>

	</form>

	<form class="search-form" method="get" action="/">

		<label for="status"> Filter by Status: </label> <select id="status"
			name="status">

			<option value="">All Statuses</option>

			<option th:each="s : ${statusList}" th:value="${s}" th:text="${s}"
				th:selected="${s == selectedStatus}"></option>

		</select>

		<button type="submit">Filter</button>

		<a class="clear-link" href="/"> Clear </a>

	</form>

	<table>

		<tr>

			<th>ID</th>

			<th>Doctor</th>

			<th>Patient</th>

			<th>Date & Time</th>

			<th>Reason</th>

			<th>Status</th>

			<th>Actions</th>

		</tr>

		<tr th:each="a : ${appointmentList}">

			<td th:text="${a.id}"></td>

			<td
				th:text="${a.doctor.firstName
				+ ' '
				+ a.doctor.lastName}">

			</td>

			<td
				th:text="${a.patient.firstName
				+ ' '
				+ a.patient.lastName}">

			</td>

			<td th:text="${a.appointmentDateTime}"></td>

			<td th:text="${a.reason}"></td>

			<td th:text="${a.status}"></td>

			<td><a class="action-link"
				th:href="@{/editAppointment/{id}(id=${a.id})}"> Edit </a> | <a
				class="delete-link" th:href="@{/deleteAppointment/{id}(id=${a.id})}"
				onclick="return confirm('Are you sure you want to delete this appointment?');">

					Delete </a></td>

		</tr>

		<tr th:if="${#lists.isEmpty(appointmentList)}">

			<td class="empty-message" colspan="7">No appointments found.</td>

		</tr>

	</table>

</body>

</html>
