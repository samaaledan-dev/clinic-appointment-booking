<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Patients</title>

<style>
body {
	font-family: Arial, sans-serif;
	margin: 30px;
}

nav {
	margin-bottom: 25px;
}

nav a {
	margin-right: 15px;
}

table {
	border-collapse: collapse;
	width: 80%;
}

table, th, td {
	border: 1px solid black;
	padding: 8px;
}

th {
	background-color: lightgray;
}
</style>

</head>

<body>

	<h1>Patients</h1>

	<nav>
		<a href="/">Appointments</a> <a href="/doctors">Doctors</a> <a
			href="/patients">Patients</a>
	</nav>

	<table>

		<tr>
			<th>ID</th>
			<th>First Name</th>
			<th>Last Name</th>
			<th>Email</th>
			<th>Phone</th>
		</tr>

		<tr th:each="p : ${patientList}">

			<td th:text="${p.id}"></td>
			<td th:text="${p.firstName}"></td>
			<td th:text="${p.lastName}"></td>
			<td th:text="${p.email}"></td>
			<td th:text="${p.phone}"></td>

		</tr>

	</table>

</body>

</html>
