<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Doctors</title>

<style>
table {
	border-collapse: collapse;
	width: 80%;
}

table, th, td {
	border: 1px solid black;
	padding: 8px;
}

th {
	background: lightgray;
}
</style>

</head>
<body>

	<h1>Doctors</h1>

	<a href="/">Appointments</a>

	<br>
	<br>

	<table>

		<tr>
			<th>ID</th>
			<th>First Name</th>
			<th>Last Name</th>
			<th>Specialization</th>
			<th>Phone</th>
			<th>Email</th>
		</tr>

		<tr th:each="d : ${doctorList}">

			<td th:text="${d.id}"></td>
			<td th:text="${d.firstName}"></td>
			<td th:text="${d.lastName}"></td>
			<td th:text="${d.specialization}"></td>
			<td th:text="${d.phone}"></td>
			<td th:text="${d.email}"></td>

		</tr>

	</table>

</body>
</html>
